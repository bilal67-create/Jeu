<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nous deux ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#14091d,#54183b);color:white;display:flex;align-items:center;justify-content:center;padding:16px}.app{width:min(680px,100%);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:30px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.42);backdrop-filter:blur(16px)}h1{text-align:center;margin:0 0 5px;font-size:34px}.sub{text-align:center;opacity:.72;margin-bottom:22px}.card{min-height:310px;background:rgba(0,0,0,.17);border-radius:25px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.badge{font-size:14px;opacity:.62;margin-bottom:16px}#q{font-size:25px;line-height:1.4;font-weight:750}.surprise{width:100%;border:0;border-radius:18px;padding:18px;margin-top:15px;background:white;color:#351329;font-size:19px;font-weight:850;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.18)}.secondary{width:100%;border:0;border-radius:15px;padding:13px;margin-top:9px;background:rgba(255,255,255,.12);color:white;font-size:15px;font-weight:700;cursor:pointer}.stats{text-align:center;font-size:12px;opacity:.52;margin-top:12px}@media(max-width:500px){#q{font-size:21px}.card{min-height:290px;padding:22px}}
</style>
</head><body><div class="app"><h1>❤️ Nous deux</h1><div class="sub">Un jeu à deux pour rire, se découvrir et se rapprocher.</div><div class="card"><div class="badge" id="badge">✨ Prêt pour une surprise ?</div><div id="q">Appuie sur le bouton et laisse le hasard décider… 😏</div></div><button class="surprise" onclick="surprise()">✨ SURPRISE</button><button class="secondary" onclick="resetGame()">↻ Recommencer la partie</button><div class="stats" id="stats">65 questions • aucune sortie</div></div><script>
const questions=["Quelle a été ta toute première impression de moi ?","À quel moment tu as commencé à vraiment t’attacher à moi ?","Quelle est la chose que tu préfères chez moi ?","Quelle est ma qualité que tu admires le plus ?","Quel est mon défaut que tu trouves finalement attachant ?","Qu’est-ce qui te manque le plus de moi quand on est loin ?","Quel souvenir de nous te fait sourire instantanément ?","Quelle petite attention de ma part te fait le plus plaisir ?","Quelle serait notre soirée parfaite ensemble ?","Quel voyage rêves-tu de faire avec moi ?","Quelle chanson te fait penser à nous ?","Comment imagines-tu notre quotidien si on vivait ensemble ?","Quelle qualité chez moi tu voudrais que je garde toute ma vie ?","Quelle tradition aimerais-tu créer rien qu’à nous deux ?","Quelle est la chose la plus romantique que tu aimerais que je fasse pour toi ?","Qui de nous deux survivrait le moins longtemps sur une île déserte ?","Quelle est mon habitude la plus drôle ?","Si j’étais un animal, lequel serais-je ?","Quel surnom ridicule pourrais-tu me donner ?","Si on échangeait nos corps pendant 24 heures, que ferais-tu en premier ?","Qui de nous deux serait le plus susceptible de se perdre en voyage ?","Si notre couple était un film comique, quel serait son titre ?","Quelle est la chose la plus bizarre que tu aimerais qu’on fasse ensemble ?","Qui de nous deux serait le plus difficile à supporter au réveil ?","Quelle chose aimerais-tu que je comprenne mieux chez toi ?","Qu’est-ce qui te donne le plus confiance en moi ?","Quelle valeur est indispensable pour toi dans un couple ?","Quel souvenir d’enfance aimerais-tu me raconter ?","Quelle est une chose dont tu es particulièrement fière ?","Quel rêve veux-tu absolument réaliser un jour ?","Quelle est une chose que tu aimerais changer dans ta vie ?","Qu’est-ce qui te fait te sentir en sécurité dans une relation ?","Quelle chose voudrais-tu que je sache sur toi sans avoir besoin de l’expliquer ?","Quelle est ta plus grande peur dans une relation ?","Qu’est-ce qui te fait le plus peur concernant l’avenir ?","Quelle expérience t’a le plus fait grandir ?","Qu’est-ce que tu recherches vraiment dans une relation à long terme ?","Quand tu vas mal, de quoi as-tu le plus besoin de la personne que tu aimes ?","Quelle est une chose que tu aimerais améliorer chez toi ?","Qu’est-ce qui pourrait te faire perdre confiance en quelqu’un ?","Quelle est ta définition d’une relation réussie ?","Qu’est-ce que notre relation t’apprend sur toi-même ?","Quelle est la chose que tu espères le plus pour nous deux ?","Quelle est la chose que tu trouves la plus attirante chez moi ?","Quel geste tendre de ma part te fait le plus d’effet ?","Quel moment avec moi t’a donné le plus de papillons ?","Quelle tenue sur moi préfères-tu ?","Quel type de câlin préfères-tu ?","Qu’est-ce qui te fait te sentir désirée ?","Quelle surprise romantique te ferait complètement craquer ?","Quelle chose aimerais-tu que je fasse plus souvent quand on sera ensemble ?","Quel moment de proximité avec moi te manque le plus à distance ?","Quelle est une chose que tu n’as jamais osé me demander ?","Fais-moi un compliment sans utiliser les mots beau, gentil ou amoureux.","Chante-moi le refrain d’une chanson que tu aimes.","Fais-moi une déclaration improvisée de 30 secondes.","Montre-moi une photo d’enfance que tu acceptes de partager.","Donne-moi trois surnoms que tu pourrais me donner.","Raconte notre rencontre comme une bande-annonce de film.","Fais-moi rire en moins de 20 secondes.","Dis trois choses que tu aimes chez moi très rapidement.","Dis-moi quelque chose de mignon que tu n’as jamais osé dire.","Fais-moi une mini déclaration avec seulement 10 mots."];let remaining=[...questions],count=0;const people=["Moi","Elle","Tous les deux"];function surprise(){if(!remaining.length)remaining=[...questions];const i=Math.floor(Math.random()*remaining.length),q=remaining.splice(i,1)[0],who=people[Math.floor(Math.random()*people.length)];document.getElementById("q").textContent=q;document.getElementById("badge").textContent=who==="Moi"?"🙋‍♂️ À toi de répondre":who==="Elle"?"💗 À elle de répondre":"🫶 Vous répondez tous les deux";count++;document.getElementById("stats").textContent=count+" question(s) • "+remaining.length+" restante(s)"}function resetGame(){remaining=[...questions];count=0;document.getElementById("badge").textContent="✨ Prêt pour une surprise ?";document.getElementById("q").textContent="Appuie sur le bouton et laisse le hasard décider… 😏";document.getElementById("stats").textContent=questions.length+" questions • aucune sortie"}
</script></body></html>
