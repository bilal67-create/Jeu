<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nous deux ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#14091d,#54183b);color:white;display:flex;align-items:center;justify-content:center;padding:16px}.app{width:min(680px,100%);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:30px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.42);backdrop-filter:blur(16px)}h1{text-align:center;margin:0 0 5px;font-size:34px}.sub{text-align:center;opacity:.72;margin-bottom:22px}.card{min-height:310px;background:rgba(0,0,0,.17);border-radius:25px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.badge{font-size:14px;opacity:.62;margin-bottom:16px}#q{font-size:25px;line-height:1.4;font-weight:750}.surprise{width:100%;border:0;border-radius:18px;padding:18px;margin-top:15px;background:white;color:#351329;font-size:19px;font-weight:850;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.18)}.secondary{width:100%;border:0;border-radius:15px;padding:13px;margin-top:9px;background:rgba(255,255,255,.12);color:white;font-size:15px;font-weight:700;cursor:pointer}.stats{text-align:center;font-size:12px;opacity:.52;margin-top:12px}@media(max-width:500px){#q{font-size:21px}.card{min-height:290px;padding:22px}}</style></head><body><div class="app"><h1>❤️ Nous deux</h1><div class="sub">Un jeu à deux pour rire, se découvrir et se rapprocher.</div><div class="card"><div class="badge" id="badge">✨ Prêt pour une surprise ?</div><div id="q">Appuie sur le bouton et laisse le hasard décider… 😏</div></div><button class="surprise" onclick="surprise()">✨ SURPRISE</button><button class="secondary" onclick="resetGame()">↻ Recommencer la partie</button><div class="stats" id="stats">105 questions • aucune sortie</div></div><script>
const questions=["Quelle a été ta toute première impression de moi ?","À quel moment tu as commencé à vraiment t’attacher à moi ?","Quelle est la chose que tu préfères chez moi ?","Quelle qualité chez moi admires-tu le plus ?","Quel petit détail chez moi trouves-tu particulièrement mignon ?","Qu’est-ce qui te manque le plus de moi quand on est loin ?","Quel souvenir de nous te fait sourire instantanément ?","Quelle petite attention de ma part te fait le plus plaisir ?","Quelle serait notre soirée parfaite ensemble ?","Quel voyage rêves-tu de faire avec moi ?","Quelle chanson te fait penser à notre histoire ?","Comment imagines-tu notre quotidien si on vivait ensemble ?","Quelle qualité chez moi voudrais-tu que je garde toute ma vie ?","Quelle tradition aimerais-tu créer rien qu’à nous deux ?","Quelle est la chose la plus romantique que tu aimerais que je fasse pour toi ?","Quel endroit aimerais-tu découvrir avec moi en premier ?","Quel serait notre rendez-vous idéal sans aucune contrainte de budget ?","Quel moment de notre relation t’a donné le plus de papillons ?","Quel souvenir de notre début de relation te revient le plus souvent ?","Qu’est-ce qui t’a fait comprendre que notre relation était spéciale ?","Qui de nous deux survivrait le moins longtemps sur une île déserte ?","Quelle est mon habitude la plus drôle ?","Si j’étais un animal, lequel serais-je ?","Quel surnom complètement ridicule pourrais-tu me donner ?","Si on échangeait nos corps pendant 24 heures, que ferais-tu en premier ?","Qui de nous deux serait le plus susceptible de se perdre en voyage ?","Si notre couple était un film comique, quel serait son titre ?","Quelle est la chose la plus bizarre que tu aimerais qu’on fasse ensemble ?","Qui de nous deux serait le plus difficile à supporter au réveil ?","Quelle serait notre pire dispute pour une raison totalement ridicule ?","Si on participait à une émission de télé-réalité, qui craquerait en premier ?","Qui de nous deux dépenserait le plus d’argent pour une idée complètement folle ?","Si tu devais m’imiter pendant une minute, qu’est-ce que tu ferais ?","Quel serait notre duo de personnages dans un film ?","Si je devenais célèbre demain, pourquoi serais-je connu ?","Quelle aventure improbable pourrais-tu imaginer pour nous deux ?","Quelle chose aimerais-tu que je comprenne mieux chez toi ?","Qu’est-ce qui te donne le plus confiance en moi ?","Quelle valeur est indispensable pour toi dans un couple ?","Quel souvenir d’enfance aimerais-tu me raconter ?","Quelle est une chose dont tu es particulièrement fière ?","Quel rêve veux-tu absolument réaliser un jour ?","Quelle est une chose que tu aimerais changer dans ta vie ?","Qu’est-ce qui te fait te sentir en sécurité dans une relation ?","Quelle chose voudrais-tu que je sache sur toi sans avoir besoin de l’expliquer ?","Quelle place la famille doit-elle avoir dans une relation ?","Quel est ton langage de l’amour préféré ?","Quelle activité pourrais-tu faire pendant des heures sans te lasser ?","Quel pays aimerais-tu découvrir au moins une fois dans ta vie ?","Quelle est une chose simple qui te rend immédiatement heureuse ?","Quel compliment te touche le plus sincèrement ?","Quelle habitude aimerais-tu prendre dans les prochaines années ?","Quel souvenir de vacances t’a le plus marquée ?","Quelle personne a eu le plus d’influence sur la personne que tu es aujourd’hui ?","Quelle est ta plus grande peur dans une relation ?","Qu’est-ce qui te fait le plus peur concernant l’avenir ?","Quelle expérience t’a le plus fait grandir ?","Qu’est-ce que tu recherches vraiment dans une relation à long terme ?","Quand tu vas mal, de quoi as-tu le plus besoin de la personne que tu aimes ?","Quelle est une chose que tu aimerais améliorer chez toi ?","Qu’est-ce qui pourrait te faire perdre confiance en quelqu’un ?","Quelle est ta définition d’une relation réussie ?","Qu’est-ce que notre relation t’apprend sur toi-même ?","Quelle est la chose que tu espères le plus pour nous deux ?","Quelle difficulté penses-tu qu’un couple à distance doit apprendre à gérer ?","Quelle peur aimerais-tu réussir à dépasser un jour ?","Qu’aimerais-tu que les gens comprennent mieux à propos de toi ?","Quelle décision de ta vie a le plus changé ton parcours ?","Qu’est-ce qui te rend vraiment fière de la personne que tu es devenue ?","Quelle est la chose que tu trouves la plus attirante chez moi ?","Quel geste tendre de ma part te fait le plus d’effet ?","Quel détail physique chez moi remarques-tu en premier ?","Quelle tenue sur moi préfères-tu ?","Quel type de câlin préfères-tu ?","Qu’est-ce qui te fait te sentir désirée ?","Quelle surprise romantique te ferait complètement craquer ?","Quelle chose aimerais-tu que je fasse plus souvent quand on sera ensemble ?","Quel moment de proximité avec moi te manque le plus à distance ?","Quel regard ou geste de ma part te fait particulièrement fondre ?","Quelle ambiance te paraît la plus romantique pour une soirée à deux ?","Quelle est la chose la plus tendre que tu aimerais vivre avec moi ?","Quel compliment physique venant de moi te ferait le plus plaisir ?","Quelle serait ta soirée parfaite rien que tous les deux, du début à la fin ?","Quelle chose toute simple peut créer beaucoup de tension romantique pour toi ?","Quelle est une chose que tu n’as jamais osé me demander ?","Fais-moi un compliment sans utiliser les mots beau, gentil ou amoureux.","Chante-moi le refrain d’une chanson que tu aimes.","Fais-moi une déclaration improvisée de 30 secondes.","Montre-moi une photo d’enfance que tu acceptes de partager.","Donne-moi trois surnoms que tu pourrais me donner.","Raconte notre rencontre comme une bande-annonce de film.","Fais-moi rire en moins de 20 secondes.","Dis trois choses que tu aimes chez moi très rapidement.","Dis-moi quelque chose de mignon que tu n’as jamais osé dire.","Fais-moi une mini déclaration avec exactement 10 mots.","Fais une imitation de ma façon de parler.","Décris-moi avec trois mots sans réfléchir.","Raconte ton souvenir préféré avec moi en exagérant volontairement tout.","Choisis une chanson qui résume ton humeur avec moi ce soir et explique pourquoi.","Fais-moi deviner une chose que tu penses de moi sans la dire directement.","Donne-moi un défi que je dois relever pendant l’appel.","Raconte une anecdote gênante que tu acceptes de partager.","Fais-moi un compliment que tu ne m’as encore jamais fait.","Dis-moi la première chose qui te vient à l’esprit quand tu vois mon visage.","Pendant 20 secondes, parle de moi comme si tu étais ma plus grande fan."];
const people=["Moi","Elle","Tous les deux"];let remaining=[],count=0;function save(){localStorage.setItem("nousDeuxRemaining",JSON.stringify(remaining));localStorage.setItem("nousDeuxCount",count)}function load(){try{const r=JSON.parse(localStorage.getItem("nousDeuxRemaining"));remaining=Array.isArray(r)?r.filter(q=>questions.includes(q)):[];count=Number(localStorage.getItem("nousDeuxCount"))||0}catch(e){remaining=[];count=0}if(!remaining.length)remaining=[...questions];updateStats()}function surprise(){if(!remaining.length){remaining=[...questions];count=0}const i=Math.floor(Math.random()*remaining.length),q=remaining.splice(i,1)[0],who=people[Math.floor(Math.random()*people.length)];document.getElementById("q").textContent=q;document.getElementById("badge").textContent=who==="Moi"?"🙋‍♂️ À toi de répondre":who==="Elle"?"💗 À elle de répondre":"🫶 Vous répondez tous les deux";count++;save();updateStats()}function resetGame(){remaining=[...questions];count=0;save();document.getElementById("badge").textContent="✨ Prêt pour une surprise ?";document.getElementById("q").textContent="Appuie sur le bouton et laisse le hasard décider… 😏";updateStats()}function updateStats(){document.getElementById("stats").textContent=count+" question(s) • "+remaining.length+" restante(s)"}load();</script></body></html>
