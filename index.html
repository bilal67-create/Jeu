<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>50 questions 😂</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#14091d,#54183b);color:white;display:flex;align-items:center;justify-content:center;padding:16px}.app{width:min(680px,100%);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:30px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.42);backdrop-filter:blur(16px)}h1{text-align:center;margin:0 0 5px;font-size:34px}.sub{text-align:center;opacity:.72;margin-bottom:22px}.card{min-height:310px;background:rgba(0,0,0,.17);border-radius:25px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.badge{font-size:14px;opacity:.62;margin-bottom:16px}#q{font-size:25px;line-height:1.4;font-weight:750}.surprise{width:100%;border:0;border-radius:18px;padding:18px;margin-top:15px;background:white;color:#351329;font-size:19px;font-weight:850;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,.18)}.secondary{width:100%;border:0;border-radius:15px;padding:13px;margin-top:9px;background:rgba(255,255,255,.12);color:white;font-size:15px;font-weight:700;cursor:pointer}.stats{text-align:center;font-size:12px;opacity:.52;margin-top:12px}@media(max-width:500px){#q{font-size:21px}.card{min-height:290px;padding:22px}}</style></head><body><div class="app"><h1>😂 50 questions</h1><div class="sub">Le quiz où le but est surtout de finir en fou rire.</div><div class="card"><div class="badge" id="badge">✨ Prête pour une question ?</div><div id="q">Appuie sur le bouton et laisse le hasard décider… 😈</div></div><button class="surprise" onclick="surprise()">😂 QUESTION SUIVANTE</button><button class="secondary" onclick="resetGame()">↻ Recommencer les 50 questions</button><div class="stats" id="stats">50 questions • 0 jouée</div></div><script>

const people=["🙋‍♂️ À toi !","💗 À elle !","🫶 Vous deux !"];let remaining=[],count=0;function save(){try{localStorage.setItem("quiz50Remaining",JSON.stringify(remaining));localStorage.setItem("quiz50Count",count)}catch(e){}}function load(){try{const r=JSON.parse(localStorage.getItem("quiz50Remaining"));remaining=Array.isArray(r)?r.filter(q=>questions.includes(q)):[];count=Number(localStorage.getItem("quiz50Count"))||0}catch(e){remaining=[];count=0}if(!remaining.length)remaining=[...questions];updateStats()}function surprise(){if(!remaining.length){remaining=[...questions];count=0}const i=Math.floor(Math.random()*remaining.length);const q=remaining.splice(i,1)[0];const who=people[Math.floor(Math.random()*people.length)];document.getElementById("q").textContent=q;document.getElementById("badge").textContent=who;count++;save();updateStats()}function resetGame(){remaining=[...questions];count=0;save();document.getElementById("badge").textContent="✨ Prête pour une question ?";document.getElementById("q").textContent="Appuie sur le bouton et laisse le hasard décider… 😈";updateStats()}function updateStats(){document.getElementById("stats").textContent=remaining.length+" restante(s) • "+count+" jouée(s)"}load();</script></body></html>
