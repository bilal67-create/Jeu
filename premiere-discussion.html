<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Première discussion</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#0b1726,#173f58);color:white;display:flex;align-items:center;justify-content:center;padding:16px}.app{width:min(680px,100%);background:#ffffff12;border:1px solid #ffffff25;border-radius:30px;padding:24px;box-shadow:0 25px 70px #0008;backdrop-filter:blur(16px)}h1{text-align:center;margin:0 0 5px;font-size:32px}.sub{text-align:center;opacity:.72;margin-bottom:22px}.card{min-height:310px;background:#00000022;border-radius:25px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.badge{font-size:14px;opacity:.62;margin-bottom:16px}#q{font-size:24px;line-height:1.4;font-weight:750}.surprise,.secondary{width:100%;border:0;border-radius:17px;padding:17px;margin-top:15px;font-size:18px;font-weight:850;cursor:pointer}.surprise{background:white;color:#15354a}.secondary{margin-top:9px;background:#ffffff18;color:white;font-size:14px}.stats{text-align:center;font-size:12px;opacity:.52;margin-top:12px}</style></head><body><div class="app"><h1>💬 Première discussion</h1><div class="sub">Des questions naturelles pour apprendre à connaître quelqu’un que tu viens de rencontrer.</div><div class="card"><div class="badge" id="badge">✨ Prêt à faire connaissance ?</div><div id="q">Appuie sur le bouton et laisse le hasard choisir la prochaine question.</div></div><button class="surprise" onclick="next()">✨ QUESTION AU HASARD</button><button class="secondary" onclick="resetGame()">↻ Recommencer</button><div class="stats" id="stats"></div></div><script>
const questions=["Tu es plutôt du matin ou du soir ?","Qu’est-ce qui te met facilement de bonne humeur ?","À quoi ressemble une journée idéale pour toi ?","Tu fais quoi généralement quand tu as du temps libre ?","Quel endroit tu aimerais vraiment découvrir un jour ?","Tu préfères voyager pour te reposer ou pour explorer ?","Quel est le dernier film ou la dernière série que tu as vraiment aimé ?","Quel genre de musique tu écoutes le plus ?","Tu as une chanson que tu pourrais écouter en boucle ?","Quel plat tu pourrais manger très souvent sans t’en lasser ?","Tu es plutôt restaurant, cuisine maison ou livraison ?","Quel est ton petit plaisir coupable ?","Tu préfères la mer, la montagne ou la ville ?","Quel pays t’attire particulièrement ?","Tu as déjà fait un voyage qui t’a vraiment marqué ?","Quel endroit où tu es allé t’a le plus surpris ?","Tu es plutôt spontané ou tu aimes tout prévoir ?","Tu préfères les grandes soirées ou les petits comités ?","Tu es plutôt bavard ou observateur quand tu rencontres quelqu’un ?","Qu’est-ce qui te fait rire à coup sûr ?","Quel genre d’humour tu préfères ?","Quelle est une chose que peu de gens savent sur toi ?","Quelle qualité tu apprécies le plus chez quelqu’un ?","Et quel défaut tu supportes difficilement ?","Qu’est-ce qui te donne rapidement une bonne impression de quelqu’un ?","Qu’est-ce qui peut te faire perdre immédiatement confiance en quelqu’un ?","Tu accordes facilement ta confiance ou tu prends ton temps ?","Qu’est-ce qui compte le plus pour toi dans une amitié ?","Quelle place ta famille occupe-t-elle dans ta vie ?","Tu es proche de tes frères et sœurs ou de tes cousins ?","Quel souvenir d’enfance te fait encore sourire ?","Comment étais-tu quand tu étais enfant ?","Tu étais plutôt sage ou un peu turbulent ?","Quel rêve avais-tu quand tu étais petit ?","Est-ce qu’il y a une passion que tu avais avant et que tu as abandonnée ?","Quelle activité pourrais-tu faire pendant des heures sans voir le temps passer ?","Si tu pouvais apprendre une nouvelle compétence instantanément, laquelle choisirais-tu ?","Quel métier aurais-tu aimé essayer au moins une fois ?","Si tu pouvais changer de vie pendant une semaine, tu choisirais quelle vie ?","Quel est un sujet dont tu pourrais parler pendant des heures ?","Qu’est-ce qui te passionne en ce moment ?","Tu as plutôt besoin de beaucoup de monde autour de toi ou de moments seul ?","Quand tu as besoin de décompresser, tu fais quoi ?","Qu’est-ce qui te fait te sentir vraiment bien dans une journée ?","Quel est ton plus gros défaut selon toi ?","Et ta plus grande qualité ?","Quelle chose aimerais-tu améliorer chez toi ?","De quoi es-tu le plus fier aujourd’hui ?","Quel objectif aimerais-tu atteindre prochainement ?","Tu es plutôt du genre à prendre des risques ou à jouer la sécurité ?","Quelle décision a changé quelque chose d’important dans ta vie ?","Quel conseil t’a vraiment marqué ?","Quelle leçon de vie as-tu apprise assez tard ?","Qu’est-ce que tu recherches chez les personnes que tu laisses entrer dans ta vie ?","Pour toi, qu’est-ce qui fait qu’une conversation devient vraiment intéressante ?","Quelle question tu aimerais qu’on te pose plus souvent ?","Qu’est-ce qui te fait te sentir rapidement à l’aise avec quelqu’un ?","Tu préfères parler de choses sérieuses ou partir dans des discussions complètement absurdes ?","Quelle est la conversation la plus intéressante que tu aies eue récemment ?","Si tu pouvais dîner avec n’importe quelle personne, vivante ou historique, qui choisirais-tu ?","Si tu pouvais vivre dans une autre époque, laquelle ?","Si tu pouvais habiter n’importe où pendant un an, où irais-tu ?","Si tu avais un billet d’avion pour demain, où partirais-tu ?","Si tu gagnais une grosse somme d’argent demain, quelle serait la première chose que tu ferais ?","Si tu pouvais maîtriser une langue instantanément, laquelle ?","Si tu pouvais revivre une journée de ta vie, laquelle choisirais-tu ?","Quelle expérience aimerais-tu absolument vivre au moins une fois ?","Quel est ton genre de week-end parfait ?","Tu préfères improviser une sortie ou rester tranquillement chez toi ?","Quel est ton endroit préféré pour passer du temps ?","Tu as une ville dans laquelle tu pourrais facilement te voir vivre ?","Quel type de personnes t’attire naturellement en amitié ?","Tu penses qu’on peut vraiment connaître quelqu’un rapidement ?","Qu’est-ce qui te fait dire qu’une personne est intéressante ?","Tu préfères quelqu’un qui te ressemble ou quelqu’un de très différent de toi ?","Qu’est-ce qui te fait généralement continuer une conversation avec quelqu’un ?","Quelle est la première chose que tu remarques chez une personne ?","Tu es plutôt à faire le premier pas ou à attendre ?","Tu préfères recevoir des messages toute la journée ou avoir une vraie longue conversation ?","Tu trouves ça facile de parler avec quelqu’un que tu ne connais pas ?","Qu’est-ce qui peut rendre une première rencontre mémorable pour toi ?","Quelle serait pour toi une première sortie simple mais réussie ?","Tu préfères discuter autour d’un café, marcher ou faire une activité ?","Quel sujet tu éviterais lors d’une toute première discussion ?","Qu’est-ce qui te donne envie de revoir quelqu’un après une première rencontre ?","Quel compliment te fait vraiment plaisir ?","Tu préfères qu’on te fasse rire ou qu’on t’impressionne ?","Qu’est-ce qui te fait te sentir respecté par quelqu’un ?","Quelle valeur est non négociable pour toi ?","Qu’est-ce que tu apprécies le plus chez les gens ?","Quelle qualité aimerais-tu développer davantage chez toi ?","Quelle chose simple peut rendre ta journée meilleure ?","Quel petit détail peut te faire sourire sans raison ?","Quel souvenir récent te rend particulièrement heureux ?","Quelle personne t’inspire le plus dans ton entourage ?","Qu’est-ce que tu aimerais que les gens comprennent mieux sur toi ?","Tu penses être quelqu’un de facile à cerner ?","Quelle partie de ta personnalité les gens découvrent seulement avec le temps ?","Qu’est-ce qui te surprend généralement chez les nouvelles personnes ?","Quelle question poserais-tu à quelqu’un pour vraiment commencer à le connaître ?","Après cette question, qu’est-ce que tu aimerais savoir sur moi ?"];
let remaining=[...questions],count=0;function next(){if(!remaining.length)remaining=[...questions];const i=Math.floor(Math.random()*remaining.length);document.getElementById('q').textContent=remaining.splice(i,1)[0];document.getElementById('badge').textContent='💬 À toi de répondre';count++;document.getElementById('stats').textContent=count+' question(s) • '+remaining.length+' restante(s)'}function resetGame(){remaining=[...questions];count=0;document.getElementById('badge').textContent='✨ Prêt à faire connaissance ?';document.getElementById('q').textContent='Appuie sur le bouton et laisse le hasard choisir la prochaine question.';document.getElementById('stats').textContent=questions.length+' questions disponibles'}document.getElementById('stats').textContent=questions.length+' questions disponibles';
</script></body></html>
